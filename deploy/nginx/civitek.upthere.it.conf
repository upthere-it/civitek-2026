# nginx per civitek.upthere.it (ARCHITECTURE §9, deploy/README.md).
# Va in /etc/nginx/conf.d/ (o sites-available + link). Percorsi da adattare: /srv/civitek è la cartella del repo.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Utenti minorenni: nei log di accesso l'IP è troncato (ultimo ottetto a 0, IPv6 ai primi tre gruppi).
map $remote_addr $civitek_ip_anon {
  ~^(?P<a>\d+\.\d+\.\d+)\.\d+$       $a.0;
  ~^(?P<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $b::;
  default                            -;
}
log_format civitek_anon '$civitek_ip_anon [$time_local] "$request" $status $body_bytes_sent $request_time';

server {
  listen 80;
  listen [::]:80;
  server_name civitek.upthere.it;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name civitek.upthere.it;

  # certbot --nginx li scrive da solo; con certbot certonly vanno messi a mano
  ssl_certificate     /etc/letsencrypt/live/civitek.upthere.it/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/civitek.upthere.it/privkey.pem;

  root /srv/civitek/apps/client/dist;
  access_log /var/log/nginx/civitek.access.log civitek_anon;
  error_log  /var/log/nginx/civitek.error.log warn;

  # niente analytics né risorse esterne: tutto dal nostro dominio (ARCHITECTURE §10)
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # socket.io: WebSocket con upgrade, e long polling per i browser in-app che lo bloccano
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # il server prende l'ULTIMO indirizzo (quello messo qui da nginx): limiti per IP del recupero
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # bundle Vite con hash nel nome: cache lunga ("expires" non annulla gli add_header del server)
  location /static/ {
    expires 1y;
    try_files $uri =404;
  }

  # asset di gioco senza hash (sprite, mappa, font): cache breve
  location /assets/ {
    expires 1h;
    try_files $uri =404;
  }

  location = /privacy {
    return 301 /privacy/;
  }

  # index.html e privacy/index.html: sempre rivalidati, così un deploy arriva subito ai telefoni
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
